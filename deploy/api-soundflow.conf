# Nginx para api-soundflow.devszens.com → NestJS en PM2 (puerto 5006, solo localhost).
# Se instala con scripts/install-nginx.sh (certbot agrega el bloque 443 y la redirección).
#
# Capas anti-bots:
#   - Rate limit por IP (API general, login/registro y media por separado) → 429.
#   - Solo existen /api/ y /media/; cualquier otra ruta (escáneres de .env, wp-admin, .git...) → 444.
#   - User-Agents de escáneres conocidos → 444.
#   - fail2ban (deploy/fail2ban-soundflow.conf) banea las IPs que insisten.

limit_req_zone  $binary_remote_addr zone=soundflow_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=soundflow_auth:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr zone=soundflow_media:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=soundflow_conn:10m;

map $http_user_agent $soundflow_bad_ua {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|wpscan|acunetix|netsparker|python-requests|go-http-client|libwww-perl) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-soundflow.devszens.com;

    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_conn soundflow_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($soundflow_bad_ua) { return 444; }
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|OPTIONS)$) { return 405; }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=soundflow_auth burst=5 nodelay;
        include /etc/nginx/snippets/soundflow-proxy.conf;
    }

    location /api/ {
        limit_req zone=soundflow_api burst=30 nodelay;
        include /etc/nginx/snippets/soundflow-proxy.conf;
    }

    # Audio/video usan peticiones Range: límite más holgado.
    location /media/ {
        limit_req zone=soundflow_media burst=60 nodelay;
        include /etc/nginx/snippets/soundflow-proxy.conf;
    }

    location = / { return 204; }

    location / { return 444; }

    access_log /var/log/nginx/api-soundflow.access.log;
    error_log  /var/log/nginx/api-soundflow.error.log;
}
