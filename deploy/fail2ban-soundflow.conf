# Copiar a /etc/fail2ban/jail.d/soundflow.conf (lo hace scripts/install-nginx.sh).
# Banea 1 h a las IPs que se pasan del rate limit o barren rutas típicas de bots.
[nginx-limit-req-soundflow]
enabled  = true
filter   = nginx-limit-req
backend  = auto
logpath  = /var/log/nginx/api-soundflow.error.log
findtime = 10m
maxretry = 20
bantime  = 1h

[nginx-botsearch-soundflow]
enabled  = true
filter   = nginx-botsearch
backend  = auto
logpath  = /var/log/nginx/api-soundflow.access.log
findtime = 10m
maxretry = 5
bantime  = 1h
